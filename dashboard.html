<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse AI- Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="nav-brand">
        <div class="small-logo">CF</div>
        <span>CampusPulse AI</span>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<main class="container">

    <section class="welcome">
        <div>
            <h1>Student Dashboard</h1>
            <p>Report and track campus issues easily.</p>
        </div>

        <button class="primary-btn small-btn"
                onclick="location.href='report.html'">
            + Report Issue
        </button>
    </section>

    <section class="stats-grid">

    <div class="stat-card">
        <h3>Total Complaints</h3>
        <strong id="totalComplaints">0</strong>
    </div>

    <div class="stat-card">
        <h3>Submitted</h3>
        <strong id="submittedComplaints">0</strong>
    </div>

    <div class="stat-card">
        <h3>In Progress</h3>
        <strong id="inProgressComplaints">0</strong>
    </div>

    <div class="stat-card">
        <h3>Resolved</h3>
        <strong id="resolvedComplaints">0</strong>
    </div>

</section>

    <section class="quick-section">

        <h2>Quick Actions</h2>

        <div class="action-grid">

            <div class="action-card"
                 onclick="location.href='report.html'">
                <div class="action-icon">📝</div>
                <h3>Report an Issue</h3>
                <p>Report electrical, classroom, Wi-Fi and other problems.</p>
            </div>

            <div class="action-card"
                 onclick="location.href='complaints.html'">
                <div class="action-icon">📋</div>
                <h3>My Complaints</h3>
                <p>View and track your submitted complaints.</p>
            </div>

        </div>

    </section>

</main>

<script src="script.js"></script>
</body>
</html>
