<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusPulse AI - Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="nav-brand">
        <div class="small-logo">CF</div>
        <span>CampusPulse AI Admin</span>
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>
</header>

<main class="container">

    <div class="welcome">
        <div>
            <h1>Admin Dashboard</h1>
            <p>Manage and monitor campus complaints.</p>
        </div>
    </div>

    <!-- Dashboard Statistics -->
    <section class="stats-grid">

        <div class="stat-card">
            <h3>Total Complaints</h3>
            <strong id="totalComplaints">0</strong>
        </div>

        <div class="stat-card">
            <h3>Submitted</h3>
            <strong id="submittedcomplaints">0</strong>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <strong id="inProgressComplaints">0</strong>
        </div>

        <div class="stat-card">
            <h3>Resolved</h3>
            <strong id="resolvedComplaints">0</strong>
        </div>

    </section>

    <!-- Complaints Section -->
    <section class="filter-section">

        <h2>All Complaints</h2>

        <div class="filters">

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Electrical">Electrical</option>
                <option value="Classroom">Classroom</option>
                <option value="Lab">Lab</option>
                <option value="Wi-Fi">Wi-Fi</option>
                <option value="Water">Water</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other</option>
            </select>

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="Submitted">Submitted</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
            </select>

        </div>

    </section>

    <!-- Complaints Table -->
    <div class="admin-table-wrapper">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="complaintsTableBody">
                <tr>
                    <td colspan="6">Loading complaints...</td>
                </tr>
            </tbody>
        </table>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
